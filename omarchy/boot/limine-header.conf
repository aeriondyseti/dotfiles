interface_help_hidden: yes
interface_help_color: 3a9c76
interface_help_color_bright: 7dffc9

wallpaper: boot():/boot-wallpaper.bmp
wallpaper_style: stretched
backdrop: 000202

term_background: ff000000
term_margin: 420
term_margin_gradient: 0
term_foreground: c8f5dc
term_foreground_bright: ffffff
term_background_bright: 0f3d2c
term_palette: 000202;e0565b;2ee6a8;d9c46b;3aa5c9;9b7fd1;5fe0c8;a8c9ba
term_palette_bright: 1f3a30;ff7a7f;7dffc9;f0dc8a;6fc4e6;bba3ef;8ff5e0;e8fff4

